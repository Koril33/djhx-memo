# memo.djhx.site shares the existing djhx.site wildcard certificate.
# Install as /etc/nginx/conf.d/zz-djhx-memo.conf to preserve the existing default host.
server {
    listen 80;
    server_name memo.djhx.site;
    access_log off;
    return 301 https://memo.djhx.site$request_uri;
}
server {
    listen 443 ssl;
    server_name memo.djhx.site;
    ssl_certificate /etc/letsencrypt/live/djhx-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djhx-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    # Do not log authentication fields, query strings or request bodies.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
