# Replace memo.example.com and certificate paths with your real domain/certificate.
# These server blocks belong inside nginx's http {} context.
server {
    listen 80;
    server_name memo.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name memo.example.com;
    ssl_certificate /etc/letsencrypt/live/memo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    # Do not log authentication fields, query strings or request bodies.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
