# djhx-memo 发布与构建自动化
#
# 触发：
#   - push tag v*  （正式发版：构建四类签名产物 + 创建 draft Release）
#   - workflow_dispatch（手动触发：仅构建并上传产物，不创建 Release）
#
# 策略（路线 A，见 docs/ci-cd-plan.md 与 docs/adr/0017-github-actions-ci.md）：
#   - CI 构建并签名：Windows setup.exe + Tauri .sig（TAURI_SIGNING_PRIVATE_KEY）、
#     Android 已签名 APK（原证书 keystore）、Linux DEB、服务端 tar.gz。
#   - 签名私钥经 GitHub Secrets 注入；更新目录签名与官网部署仍在维护者服务器。
#   - Release 只创建为 draft，由维护者核验后公开；不覆盖已有 tag / 附件。
#
# 待办（后续硬化）：
#   - 第三方 action 固定到完整 commit SHA（当前使用版本 tag）。
#   - 签名 job 绑定 Environment + required reviewers + tag ruleset。
#   - 桌面/Android 测试自动化（svelte-check/vitest、detekt/lint/unitTest）拆分到独立 job。

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-22.04
    outputs:
      client_version: ${{ steps.versions.outputs.client_version }}
      server_version: ${{ steps.versions.outputs.server_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read versions and verify tag
        id: versions
        run: |
          client="$(node -p "require('./desktop/package.json').version")"
          server="$(sed -n 's/^memo_version=//p' scripts/package-server.sh | head -n 1)"
          echo "client_version=${client}" >> "$GITHUB_OUTPUT"
          echo "server_version=${server}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "${client}" != "${tag}" ]; then
              echo "::error::tag v${tag} does not match desktop client version ${client}"
              exit 1
            fi
          fi

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: core checks
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path core/Cargo.toml
      - name: server checks
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  server:
    needs: version-check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: Build server tarball
        run: bash scripts/package-server.sh
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp dist/server/djhx-memo-server-*.tar.gz \
             "artifacts/djhx-memo-server-${{ needs.version-check.outputs.server_version }}-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: artifacts/
          retention-days: 14

  linux-deb:
    needs: version-check
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential curl wget file
      - name: Build DEB
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build -- --config src-tauri/tauri.linux.conf.json --bundles deb -- --locked
      - name: Collect artifact
        working-directory: desktop
        run: |
          mkdir -p artifacts
          cp "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)" \
             "artifacts/djhx-memo-${{ needs.version-check.outputs.client_version }}-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktop/artifacts/
          retention-days: 14

  windows-exe:
    needs: version-check
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build NSIS installer (signed updater artifact)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm ci
          npm run tauri build -- --bundles nsis -- --locked
      - name: Collect artifact
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName "artifacts/djhx-memo-${{ needs.version-check.outputs.client_version }}-windows-x64-setup.exe"
          $sig = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.sig | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "artifacts/djhx-memo-${{ needs.version-check.outputs.client_version }}-windows-x64-setup.exe.sig" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/artifacts/
          retention-days: 14

  android:
    needs: version-check
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;30.0.16248370" \
            "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          DJHX_ANDROID_KEYSTORE_B64: ${{ secrets.DJHX_ANDROID_KEYSTORE_B64 }}
          DJHX_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          DJHX_ANDROID_STORE_PASSWORD: ${{ secrets.DJHX_ANDROID_STORE_PASSWORD }}
          DJHX_ANDROID_KEY_PASSWORD: ${{ secrets.DJHX_ANDROID_KEY_PASSWORD }}
          DJHX_ANDROID_KEY_ALIAS: ${{ secrets.DJHX_ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$DJHX_ANDROID_KEYSTORE_B64" | base64 -d > "$DJHX_ANDROID_KEYSTORE"
          ./android/scripts/build-native.sh
          cd android && ./gradlew --no-daemon assembleRelease
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/djhx-memo-${{ needs.version-check.outputs.client_version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/
          retention-days: 14

  release:
    needs: [server, linux-deb, windows-exe, android]
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum djhx-memo-* > SHA256SUMS
          ls -l
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/djhx-memo-* dist/SHA256SUMS
