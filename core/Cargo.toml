[package]
license = "MIT"
name = "djhx-memo-core"
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "bindgen"
required-features = ["bindgen"]

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
pulldown-cmark = "=0.13.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
syntect = { version = "=5.3.0", default-features = false }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
uniffi = "=0.32.2"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
webpki-roots = "1"
zip = { version = "=9.3.0", default-features = false }
