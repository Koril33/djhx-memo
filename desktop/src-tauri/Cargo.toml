[package]
license = "MIT"
name = "djhx-memo-desktop"
version = "0.1.2"
description = "本地优先的 Markdown 备忘录"
authors = ["djhx-memo contributors"]
edition = "2024"
rust-version = "1.99"

[[bin]]
name = "djhx-memo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
djhx-memo-core = { path = "../../core" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
keyring = "=4.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
