<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="DJHX Memo 是一款本地优先、支持云同步的 Markdown 笔记应用。离线写作，按需同步，可在 Windows、Linux 和 Android 设备间使用。" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta property="og:title" content="DJHX Memo · 写下日常，留住想法" />
    <meta property="og:description" content="本地优先、支持云同步的开源 Markdown 笔记应用。" />
    <title>DJHX Memo · 写下日常，留住想法</title>
    <script>
      try {
        var t = localStorage.getItem("djhx-memo:theme");
        document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="skip">跳到主要内容</a>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="arrow-ne" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
      <symbol id="window-icon" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 9h18M12 9v10"/></symbol>
      <symbol id="search-icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></symbol>
      <symbol id="check-icon" viewBox="0 0 24 24"><path d="m5 12 5 5 9-9"/></symbol>
      <!-- 平台字形：几何化处理，与界面线性图标同一笔画体系 -->
      <symbol id="os-windows" viewBox="0 0 24 24"><path d="M3.5 3.5h7.5v7.5H3.5zM13 3.5h7.5v7.5H13zM3.5 13h7.5v7.5H3.5zM13 13h7.5v7.5H13z"/></symbol>
      <symbol id="os-linux" viewBox="0 0 24 24"><path d="M3 4.5h18v15H3z"/><path d="m7 10 3 2.5L7 15m5 0h5"/></symbol>
      <symbol id="os-android" viewBox="0 0 24 24"><path d="M4 18.5a8 8 0 0 1 16 0z"/><path d="m7.2 8.6-2-3m11.6 3 2-3"/><circle cx="9" cy="14.5" r=".6"/><circle cx="15" cy="14.5" r=".6"/></symbol>
      <filter id="brush" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency=".9 .06" numOctaves="2" seed="11" />
        <feDisplacementMap in="SourceGraphic" scale="4" />
      </filter>
    </svg>

    <!-- 背景层：和纸纹理 + 十二栏网格 + 裁切标记，纯静态，不参与重排 -->
    <div class="backdrop" aria-hidden="true">
      <div class="wrap grid-lines"></div>
      <i class="crop crop-tl"></i><i class="crop crop-tr"></i><i class="crop crop-bl"></i><i class="crop crop-br"></i>
    </div>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="./" aria-label="DJHX Memo">
          <img src="./logo.svg" alt="" width="26" height="26" />
          <span>DJHX Memo</span>
        </a>
        <nav class="nav" aria-label="工具">
          <div class="seg" id="lang-switch" role="radiogroup" aria-label="切换语言" data-i18n-aria="nav.lang">
            <label><input type="radio" name="lang" value="zh" aria-label="简体中文" /><span lang="zh-CN">中</span></label>
            <label><input type="radio" name="lang" value="en" aria-label="English" /><span lang="en">EN</span></label>
            <label><input type="radio" name="lang" value="ja" aria-label="日本語" /><span lang="ja">日</span></label>
            <label><input type="radio" name="lang" value="ko" aria-label="한국어" /><span lang="ko">한</span></label>
            <i class="seg-thumb" aria-hidden="true"></i>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅模式" data-i18n-aria="nav.theme" data-i18n-title="nav.theme">
            <span class="orb" aria-hidden="true"></span>
          </button>
          <a class="github-link" href="https://github.com/Koril33/djhx-memo" aria-label="GitHub 项目" data-i18n-aria="nav.github" data-i18n-title="nav.github">
            <svg class="github-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.16-.02-2.1-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.53-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.73.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.04.77 2.1 0 1.52-.01 2.74-.01 3.11 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
          </a>
        </nav>
      </div>
    </header>

    <main id="main" class="stage">
      <div class="wrap stage-grid">
        <div class="intro-pane">
          <p class="eyebrow"><span class="eyebrow-bar"></span>v0.1.7</p>
          <h1 class="headline">
            <span data-i18n="hero.title">随手记下。</span>
            <span class="hanko" aria-hidden="true">記</span>
          </h1>
          <p class="sub" data-i18n="hero.sub">本地优先，按需云同步。</p>

          <p class="download-label" id="download-label" data-i18n="download.label">下载</p>
          <ul class="platforms" aria-labelledby="download-label">
            <li>
              <a class="platform" data-platform="windows" href="https://github.com/Koril33/djhx-memo/releases/download/v0.1.7/djhx-memo-0.1.7-windows-x64-setup.exe" target="_blank" rel="noopener noreferrer">
                <svg class="icon os" aria-hidden="true"><use href="#os-windows"/></svg>
                <svg class="icon go" aria-hidden="true"><use href="#arrow-ne"/></svg>
                <strong>Windows</strong><small>x64 · EXE</small>
              </a>
            </li>
            <li>
              <a class="platform" data-platform="linux" href="https://github.com/Koril33/djhx-memo/releases/download/v0.1.7/djhx-memo-0.1.7-linux-amd64.deb" target="_blank" rel="noopener noreferrer">
                <svg class="icon os" aria-hidden="true"><use href="#os-linux"/></svg>
                <svg class="icon go" aria-hidden="true"><use href="#arrow-ne"/></svg>
                <strong>Linux</strong><small>amd64 · DEB</small>
              </a>
            </li>
            <li>
              <a class="platform" data-platform="android" href="https://github.com/Koril33/djhx-memo/releases/download/v0.1.7/djhx-memo-0.1.7-android.apk" target="_blank" rel="noopener noreferrer">
                <svg class="icon os" aria-hidden="true"><use href="#os-android"/></svg>
                <svg class="icon go" aria-hidden="true"><use href="#arrow-ne"/></svg>
                <strong>Android</strong><small>10+ · APK · 0.1.7</small>
              </a>
            </li>
          </ul>
        </div>

        <!-- 竖排索引：日式纵书，位于两栏之间的空栏 -->
        <ol class="rail" aria-hidden="true">
          <li><b>01</b><span data-i18n="rail.offline">离线可用</span></li>
          <li><b>02</b><span lang="en">Markdown</span></li>
          <li><b>03</b><span data-i18n="rail.open">开源</span></li>
        </ol>

        <figure class="preview" aria-hidden="true">
          <svg class="enso" viewBox="0 0 200 200">
            <g filter="url(#brush)">
              <path class="enso-stroke" pathLength="1" d="M162.4 64A72 72 0 1 1 124.6 32.3" />
              <path class="enso-dry" pathLength="1" d="M156 58A66 66 0 1 1 112 35" />
            </g>
          </svg>

          <div class="layer layer-desktop">
            <div class="mock mock-desktop">
              <div class="mock-top">
                <div class="dots"><i></i><i></i><i></i></div>
                <span>DJHX Memo</span>
                <svg class="icon"><use href="#window-icon"/></svg>
              </div>
              <div class="mock-body">
                <aside class="mock-sidebar">
                  <div class="mock-label">全部笔记 <span>3</span></div>
                  <div class="mock-search"><svg class="icon"><use href="#search-icon"/></svg> 搜索笔记</div>
                  <div class="mock-note active"><strong>周末小记</strong><small>窗外下过一场雨。</small></div>
                  <div class="mock-note"><strong>阅读清单</strong><small>把喜欢的段落留下来。</small></div>
                  <div class="mock-note"><strong>代码片段</strong><small>Python · JSON</small></div>
                </aside>
                <div class="mock-source">
                  <div class="pane-title">源码</div>
                  <p><span class="syntax-accent">#</span> 周末小记</p>
                  <p>窗外下过一场雨。</p>
                  <p>把这周的想法整理下来。<i class="caret"></i></p>
                  <p><span class="syntax-accent">##</span> 今天想做的事</p>
                  <p><span class="syntax-accent">- [x]</span> 读几页书<br /><span class="syntax-accent">- [ ]</span> 整理照片</p>
                  <div class="mock-code"><span class="syntax-accent">```py</span><br />print(<span class="syntax-string">"Hello"</span>)<br /><span class="syntax-accent">```</span></div>
                </div>
                <div class="mock-rendered">
                  <div class="pane-title">预览</div>
                  <div class="mock-heading">周末小记</div>
                  <p>窗外下过一场雨。<br />把这周的想法整理下来。</p>
                  <div class="mock-subheading">今天想做的事</div>
                  <div class="mock-task"><span class="checked"><svg class="icon"><use href="#check-icon"/></svg></span>读几页书</div>
                  <div class="mock-task"><span></span>整理照片</div>
                  <div class="mock-code">print(<span class="syntax-string">"Hello"</span>)</div>
                </div>
              </div>
              <div class="mock-status"><span></span> 已保存到本机</div>
            </div>
          </div>

          <div class="layer layer-phone">
            <div class="mock mock-phone">
              <div class="phone-status"><span>9:41</span><span class="phone-batt"></span></div>
              <div class="phone-label">全部笔记 <span>3</span></div>
              <div class="phone-note active"><strong>周末小记</strong><small>窗外下过一场雨。</small></div>
              <div class="phone-note"><strong>阅读清单</strong><small>把喜欢的段落留下来。</small></div>
              <div class="phone-note"><strong>代码片段</strong><small>Python · JSON</small></div>
              <div class="phone-input">写下点什么…</div>
            </div>
          </div>
        </figure>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap footer-inner">
        <span>© 2026 DJHX Memo</span>
        <span class="footer-meta">Windows / Linux / Android<i></i>MIT</span>
      </div>
    </footer>

  </body>
</html>
